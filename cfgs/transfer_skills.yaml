seed: 42
d_model: 256

cwd: /dss/dssfs04/lwp-dss-0002/pn36ce/pn36ce-dss-0000/ehrensberger
data_dir: ${cwd}/imports/mimicgen/datasets/robot
meta_dir: ${cwd}/master-thesis/data/metadata
cfgs_dir: ${cwd}/master-thesis/cfgs/dh_cfgs

datamodule: 
  _target_: data.transfer.datamodule.TransferDataModule 
  data_dir: ${data_dir}
  meta_dir: ${meta_dir}
  cfgs_dir: ${cfgs_dir}

  transforms_list: 
    - to_image 
    - resize_cnn
    - to_dtype_cnn
    - normalize 
  
  robots: 
    - iiwa 
    - panda 
  tasks:
    - square

  action_horizon: 8 
  condition_horizon: 10

  batch_size: 4

  dataset_lengths: 
  - 0.8 
  - 0.1 
  - 0.1
  
model: 
  _target_: models.transfer.sad.SkillConditionedActionDecoder
  
  d_model: ${d_model}
  tse_ckpt: /dss/dssfs04/lwp-dss-0002/pn36ce/pn36ce-dss-0000/ehrensberger/master-thesis/outputs/checkpoints/skill_discovery/last-v8.ckpt
  
  rce_kwargs:
    dsc_kwargs: 
      input_dim: 3
      hidden_dim: ${eval:"${d_model} // 2"}
      output_dim: ${d_model}

    obs_kwargs: 
      input_dim: 2
      output_dim: ${d_model}

    h_kwargs: 
      tau: 0.1
      tau_min: 0.01
      epsilon: 1e-6

  dit_kwargs:
    d_model: ${d_model}
    action_dim: 7  
    action_horizon: ${datamodule.action_horizon} 

    noise_scheduler_kwargs: 
      num_train_timesteps:  100 
      clip_sample: false # do not clip output to [-1, 1]

    decoder_layer_kwargs: 
      d_model: ${d_model} 
      nhead: 4 
      dim_feedforward: ${eval:"${d_model} * 2"}
      batch_first: true

    transformer_decoder_kwargs: 
      num_layers: 4 

    pe_kwargs: 
      d_model: ${d_model}
      max_len: 300

  pool_kwargs: 
    k: 4 
    d_model: ${d_model}

  sat_kwargs: 
    encoder_layer_kwargs: 
      d_model: ${d_model} 
      nhead: 4 
      dim_feedforward: 512 

    transformer_encoder_kwargs: 
      num_layers: 1
  
    pe_kwargs: 
      d_model: ${d_model}
      max_len: 300
    
  optimizer_kwargs: 
    optimizer: 
      lr: 1e-3
    lr_scheduler: 
      start_factor: 0.5 
      total_iters: 40 
  
logger: 
  _target_: lightning.pytorch.loggers.WandbLogger

  name: a_new_hope
  version: ${now:%Y_%m_%d_%H_%M}
  project: skill_transfer

trainer: 
  _target_: lightning.pytorch.Trainer
  accelerator: gpu   
  # strategy: ddp # delete to run on single gpu
  devices: # for ddp: -1 
    - 0 # single gpu 
  max_epochs: 400 
  num_sanity_val_steps: 2
  enable_progress_bar: true
  profiler: simple 
  default_root_dir: logs/skill_transfer/

callbacks: 
  learning_rate_monitor: 
    _target_: lightning.pytorch.callbacks.LearningRateMonitor 
    logging_interval: step 

  model_checkpoint: 
    _target_: lightning.pytorch.callbacks.ModelCheckpoint 
    monitor: val/loss_bc
    dirpath: outputs/checkpoints/${logger.project}
    filename: 'best-checkpoint-{epoch:02d}-{val_loss:.2f}'
    save_top_k: 1 
    mode: min 
    save_last: true