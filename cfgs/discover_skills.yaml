defaults: 
  - base 
  - _self_ 

d_model: 128
d_prototypes: 8

datamodule: 
  transforms_list:
    - to_image
    - grayscale
    - to_dtype_cnn
    - resize_crop_cnn
    # - normalize
  contrastive_transforms: true 

  robots: 
    - iiwa
    - panda
  tasks: 
    - square 

  data_portion: 1
  window_size: 9 # 8+1
  consistent_batch: true
  batch_size: 32
  positive_window_size: 4
  negative_window_size: 36  
                    
model: 
  _target_: models.discover.skill_encoder.SkillEncoder
  _recursive_: false

  d_model: ${d_model}
  num_plot: 2000
  ema_alpha: 0.95
  eps: 1e-6
  
  modalities: 
    # - rgb_one
    - rgb_two 
    # - g_qpos

  queue_start_epochs: 10000
  freeze_c_epochs: 0

  time_contrastive: true
  temp_time_contrastive: 0.1

  sequential_kwargs: 
    encoder_layer_kwargs: 
      d_model:  ${d_model}
      nhead: 2 
      dim_feedforward: ${d_model}
      dropout: 0
      batch_first: true
      norm_first: true

    transformer_encoder_kwargs:
      num_layers: 1
      enable_nested_tensor: false 
      mask_check: false

    pe_kwargs: 
      d_model: ${d_model}
      max_len: 300

  prototype_kwargs: 
    tau: 0.1
    model: 
      in_features: ${d_model} 
      out_features: ${d_prototypes}
      bias: false # normalization layer 

  optimizer_kwargs: 
    _target_: torch.optim.AdamW
    _recursive_: false

    lr: 1e-3
    weight_decay: 1e-6

  lr_scheduler_kwargs: 
    warmup_percentage: 0.1

    linear:  
      start_factor: 1 #1e-3
      end_factor: 1
      total_iters: 100 # adapted dynamically  

    cosine_annealing: 
      T_max: 1000 # adapted dynamically 
      eta_min: 1e-6

  sinkhorn_kwargs: 
    epsilon: 0.01
    num_iterations: 3 

  queue_kwargs:
    num_modalities: 2
    capacity: 3840
    feature_dim: ${d_model}

  tsne_kwargs: 
    n_components: 2 
    learning_rate: auto 
    init: random 
    perplexity: 25
    random_state: ${seed}
  
logger: 
  _target_: lightning.pytorch.loggers.WandbLogger
  name: wo_time_wo_gripper_w_aug_wo_do_nhead_2_four_b_eight_pt
  version: ${now:%Y_%m_%d_%H_%M}
  project: skill_discovery_new

trainer: 
  _target_: lightning.pytorch.Trainer
  overfit_batches: 4
  log_every_n_steps: 1
  accelerator: gpu   
  devices: 
    - 0
  max_epochs: 1000 
  num_sanity_val_steps: 2
  enable_progress_bar: true
  profiler: simple 
  default_root_dir: outputs/logs/${logger.project}

callbacks: 
  learning_rate_monitor: 
    _target_: lightning.pytorch.callbacks.LearningRateMonitor 
    logging_interval: step 

  model_checkpoint: 
    _target_: lightning.pytorch.callbacks.ModelCheckpoint 
    monitor: val/loss
    dirpath: outputs/checkpoints/${logger.project}/${logger.name}
    filename: best-checkpoint
    save_top_k: 1 
    mode: min 
    save_last: false