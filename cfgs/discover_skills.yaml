defaults: 
  - base 
  - _self_ 

d_model: 128
d_prototypes: 8
time_loss: contrastive # smoothing, contrastive, no_time_loss, null 

datamodule: 
  time_loss: ${time_loss}

  transforms_one_list:
    - to_image
    # - color_jitter 
    # - solarize
    # - gaussian_blur
    # - grayscale
    - to_dtype_cnn
    # - resize_crop_cnn
  transforms_two_list:
    - to_image
    # - color_jitter 
    # - gaussian_blur
    - to_dtype_cnn
  contrastive_transforms: true 

  robots: 
    # - iiwa 
    # - panda
  tasks: 
    - square 

  window_size: 9 # 8+1 in dataloading 
  consistent_batch: true
  batch_size: 32
  positive_window_size: 4
  negative_window_size: 36  
                    
model: 
  _target_: models.discover.skill_encoder.SkillEncoder
  # _target_: models.discover.skill_encoder.SkillEncoder.load_from_checkpoint
  _recursive_: false

  #checkpoint_path: /home/ehre/Documents/master-thesis/outputs/checkpoints/skill_discovery_new/wo_time_w_aug_wo_do_nhead_2_four_b_sixteen_pt_mag_001_rgb_one_wd_16_new_plots/best-checkpoint-v3.ckpt
  #weights_only: false
 
  d_model: ${d_model}
  num_plot: 2000
  num_local_chunk: 2
  ema_alpha: 0.95
  eps: 1e-6
  mag_eps: 1e-1
  mag_momentum_: 0.9
  
  modalities: 
    - rgb_one
    - rgb_two 
    - g_qpos

  queue_start_epochs: 15000
  freeze_c_epochs: 0

  time_loss: ${time_loss} # smoothing, contrastive, false
  time_loss_alpha: 0.5
  temp_time_contrastive: 0.1

  visionEncoder_kwargs: 
    repo_or_dir: ${cwd}/imports/dinov2
    model_name: vits14
  
  head_kwargs: 
    in_channels: 384
    out_dim: 128
    cnn_dim: 128
    hidden_dim: 256
    dropout: 0.1
    l2_norm: True
  
  sequential_kwargs: 
    encoder_layer_kwargs: 
      d_model:  ${d_model}
      nhead: 2 
      dim_feedforward: ${d_model}
      dropout: 0
      batch_first: true
      norm_first: true

    transformer_encoder_kwargs:
      num_layers: 1
      enable_nested_tensor: false 
      mask_check: false

    pe_kwargs: 
      d_model: ${d_model}
      max_len: 300

  prototype_kwargs: 
    tau: 0.1
    model: 
      in_features: ${d_model} 
      out_features: ${d_prototypes}
      bias: false # normalization layer 

  optimizer_kwargs: 
    _target_: torch.optim.AdamW
    _recursive_: false

    lr: 1e-3
    weight_decay: 1e-6

  lr_scheduler_kwargs: 
    warmup_percentage: 0.1

    linear:  
      start_factor: 1 #1e-3
      end_factor: 1
      total_iters: 100 # adapted dynamically  

    cosine_annealing: 
      T_max: 1000 # adapted dynamically 
      eta_min: 1e-6

  sinkhorn_kwargs: 
    epsilon: 0.05
    num_iterations: 3 

  queue_kwargs:
    num_modalities: 2
    capacity: 3840
    feature_dim: ${d_model}

  tsne_kwargs: 
    n_components: 2 
    learning_rate: auto 
    init: random 
    perplexity: 25
    random_state: ${seed}
  
logger: 
  _target_: lightning.pytorch.loggers.WandbLogger
  name: b_${trainer.overfit_batches}_pt_${d_prototypes}_${model.time_loss}_${datamodule.robots}
  version: ${now:%Y_%m_%d_%H_%M}
  project: skill_discovery_new

trainer: 
  _target_: lightning.pytorch.Trainer
  overfit_batches: 16
  log_every_n_steps: 1
  accelerator: gpu   
  devices: 
    - 0
  max_epochs: 1000 
  num_sanity_val_steps: 2
  enable_progress_bar: true
  profiler: simple 
  default_root_dir: outputs/logs/${logger.project}
  precision: 16-mixed

callbacks: 
  learning_rate_monitor: 
    _target_: lightning.pytorch.callbacks.LearningRateMonitor 
    logging_interval: step 

  model_checkpoint: 
    _target_: lightning.pytorch.callbacks.ModelCheckpoint 
    monitor: val/loss
    dirpath: outputs/checkpoints/${logger.project}/${logger.name}
    filename: best-checkpoint
    save_top_k: 1 
    mode: min 
    save_last: false