seed: 42
data_dir: /home/bing_TUM/ehrensberger/master-thesis/imports/mimicgen/datasets/robot
meta_dir: /home/bing_TUM/ehrensberger/master-thesis/thesis/data/metadata

datamodule: 
  _target_: data.discover.datamodule.MimicGenRobotDataModule
  data_dir: ${data_dir}
  meta_dir: ${meta_dir}
  window: 8 
  chunks: 10 
  crop_factor: 0.75
  depth: False
  robots: panda
  tasks: threading
  expand_depth: colormap 
  n_samples: 15 

  batch_size: 8
  shuffle: True
  num_workers: 1
  pin_memory: True
  drop_last: True
  persistent_workers: True 
  # multiprocessing_context: "forkserver" # prevents fork deadlocks in CUDA DDP
  dataset_lengths: 
  - 0.1
  - 0.1 
  - 0.8

  transforms: 
    - grayscale
    - gaussian_blur
    - color_jitter 
    - solarize
    - rotate 

model: 
  _target_: models.discover.tse.TSE

  vision_backbone_kwargs: 
    weights_path: /home/bing_TUM/ehrensberger/master-thesis/thesis/models/weights/r3m_resnet18_weights.pth
    
  vision_encoder_kwargs: 
    encoder_layer_kwargs: 
      d_model: 500 
      nhead: 1 
      dim_feedforward: 1024
    transformer_encoder_kwargs:
      num_layers: 1
  
  kmeans_kwargs: 
    k: 20 
    max_iter: 200 
    tol: 1e-4

  rgmm_kwargs: 
    k: ${model.kmeans_kwargs.k}
    d: ${model.vision_encoder_kwargs.encoder_layer_kwargs.d_model}
    max_iter: 200
    alpha: 0.1
    beta: 0.2
    sim: 
      dim: 1.0
      eps: 1.0e-6
    weights: ~
    means: ~
    covs: ~
  
  optimizer_kwargs: 
    optimizer: 
      lr: 1e-3
    lr_scheduler: 
      start_factor: 0.5 
      total_iters: 40 

logger: 
  _target_: lightning.pytorch.loggers.WandbLogger
  name: debugging
  version: ${now:%Y_%m_%d_%H_%M}
  project: skill_discovery

trainer: 
  accelerator: gpu   
  # strategy: ddp # delete to run on single gpu
  devices: # for ddp: -1 
    - 0 # single gpu 
  max_epochs: 400 
  num_sanity_val_steps: 2
  enable_progress_bar: True
  profiler: simple 
  default_root_dir: logs/skill_discovery/

TSNE: 
  n_components: 2 
  perplexity: 25
  learning_rate: auto
  init: pca