defaults: 
  - base 
  - _self_ 

d_model: 256
d_prototypes: 32

datamodule: 
  transforms_list: # r3m model expects unnormalized images with pixel values in [0, 255]
    - to_image
    - rotate 
    - resize_cnn
    - color_jitter
    - grayscale 
    - gaussian_blur
    - to_dtype_cnn
    - normalize     
  contrastive_transforms: true 

  robots: 
    - iiwa 
    - panda 
  tasks:
    - square
  
  data_portion: 1.0
  window_size: 8
  chunk_size: 4
  consistent_batch: true 
  positive_window_size: 4
  negative_window_size: 12   
  batch_size: 64
                    
model: 
  _target_: models.discover.skill_encoder.SkillEncoder
  _recursive_: false

  d_model: ${d_model}
  num_plot: 1000
  queue_start_epochs: 15
  both_viewpoints: false 

  time_contrastive: true
  temp_time_contrastive: 0.1

  uncertainty_weighting: false
  uncertainty_weighting_kwargs: 
    num_losses: 4
  
  vision_encoder_ckpt: null 
  gripper_encoder_ckpt: null 

  sequential_kwargs: 
    encoder_layer_kwargs: 
      d_model: ${d_model}
      nhead: 1 
      dim_feedforward: ${d_model}
      batch_first: True

    transformer_encoder_kwargs:
      num_layers: 2
      norm: null
      enable_nested_tensor: False 
      mask_check: False

    pe_kwargs: 
      d_model: ${d_model}
      max_len: 300

  prototype_kwargs: 
      in_features: ${d_model}
      out_features: ${d_prototypes}
      bias: false # normalization layer 

  optimizer_kwargs: 
    _target_: torch.optim.AdamW
    _recursive_: False

    lr: 1e-5
    weight_decay: 1e-6

  lr_scheduler_kwargs: 
    warmup_percentage: 0.1

    linear:  
      start_factor: 1e-4
      end_factor: 1.0 
      total_iters: 100 # adapted dynamically  

    cosine_annealing: 
      T_max: 1000 # adapted dynamically 
      eta_min: 1e-6

  sinkhorn_kwargs: 
    tau: 0.1
    sinkhorn_iterations: 3 
    epsilon: 0.05

  queue_kwargs:
    num_modalities: 2
    capacity: 3840
    feature_dim: ${d_model}

  tsne_kwargs: 
    n_components: 2 
    learning_rate: auto 
    init: random 
    perplexity: 3
    random_state: ${seed}
  
logger: 
  _target_: lightning.pytorch.loggers.WandbLogger
  name: rgb_2_depth_0_gripper_ds_1
  version: ${now:%Y_%m_%d_%H_%M}
  project: skill_discovery

trainer: 
  _target_: lightning.pytorch.Trainer
  overfit_batches: 2
  log_every_n_steps: 1 
  accelerator: gpu   
  devices: 
    - 0
  # strategy: ddp # XXX: not available
  max_epochs: 200 
  num_sanity_val_steps: 2
  enable_progress_bar: true
  profiler: simple 
  default_root_dir: outputs/logs/${logger.project}

callbacks: 
  learning_rate_monitor: 
    _target_: lightning.pytorch.callbacks.LearningRateMonitor 
    logging_interval: step 

  model_checkpoint: 
    _target_: lightning.pytorch.callbacks.ModelCheckpoint 
    monitor: val/loss
    dirpath: outputs/checkpoints/${logger.project}
    filename: 'best-checkpoint-{epoch:02d}-{val_loss:.2f}'
    save_top_k: 1 
    mode: min 
    save_last: true