seed: 42
cwd: /dss/dssfs04/lwp-dss-0002/pn36ce/pn36ce-dss-0000/ehrensberger

d_model: 512 
d_prototypes: 16

data_dir: ${cwd}/imports/mimicgen/datasets/robot
meta_dir: ${cwd}/master-thesis/data/metadata

datamodule: 
  _target_: data.discover.datamodule.MimicGenRobotDataModule

  data_dir: ${data_dir}
  meta_dir: ${meta_dir}

  robots: null # iiwa, panda, sawyer, ur5e
  tasks: null # square, threading
  n_ds: 2 # {1, 2} if d_0 or d_0 & d_1
  f_ds: 1
  depth: false # True: include depth maps  
  crop_factor: 0.75 # (0, 1)
  noise_level: 0.1 # (0, 1)
  window: 8 # > 0
  chunk: 4 # > 0

  batch_size: 32
  shuffle: true
  num_workers: 0
  pin_memory: true
  persistent_workers: false
 
  dataset_lengths: 
  - 0.8
  - 0.1
  - 0.1

  seed: ${seed}

  ctr_transforms: false
  transforms: 
    - to_image
    - resize
    - to_dtype

model: 
  _target_: models.discover.skill_encoder.SkillEncoder
  _recursive_: false

  d_model: ${d_model}
  n_plot: 1000
  
  vision_encoder_ckpt: null 
  gripper_encoder_ckpt: null 

  sequential_kwargs: 
    encoder_layer_kwargs: 
      d_model: ${d_model}
      nhead: 4 
      dim_feedforward: ${d_model}
      batch_first: True

    transformer_encoder_kwargs:
      num_layers: 8
      norm: null
      enable_nested_tensor: False 
      mask_check: False

    pe_kwargs: 
      d_model: ${d_model}
      max_len: 300

  prototype_kwargs: 
      in_features: ${d_model}
      out_features: ${d_prototypes}
      bias: false # normalization layer 

  optimizer_kwargs: 
    _target_: torch.optim.AdamW
    _recursive_: False

    lr: 1e-5
    weight_decay: 1e-6

  lr_scheduler_kwargs: 
    warmup_percentage: 0.1

    linear:  
      start_factor: 1e-4
      end_factor: 1.0 
      total_iters: 100 # adapted dynamically  

    cosine_annealing: 
      T_max: 1000 # adapted dynamically 
      eta_min: 1e-6
  
  uncertainty_weighting_kwargs: 
    num_losses: 3 

  sinkhorn_kwargs: 
    tau: 0.1
    sinkhorn_iterations: 3 
    epsilon: 0.05

  queue_kwargs: 
    num_modalities: 3
    capacity: 3840
    feature_dim: ${d_model}

  tsne_kwargs: 
    n_components: 2 
    learning_rate: auto 
    init: random 
    perplexity: 3
    random_state: ${seed}
  
logger: 
  _target_: lightning.pytorch.loggers.WandbLogger
  name: rgb_2_depth_0_gripper_ds_1
  version: ${now:%Y_%m_%d_%H_%M}
  project: skill_discovery

trainer: 
  _target_: lightning.pytorch.Trainer
  # overfit_batches: 1
  log_every_n_steps: 1 
  accelerator: gpu   
  devices: 
    - 0
  max_epochs: 200 
  num_sanity_val_steps: 2
  enable_progress_bar: true
  profiler: simple 
  default_root_dir: outputs/logs/${logger.project}

callbacks: 
  learning_rate_monitor: 
    _target_: lightning.pytorch.callbacks.LearningRateMonitor 
    logging_interval: step 

  model_checkpoint: 
    _target_: lightning.pytorch.callbacks.ModelCheckpoint 
    monitor: val/loss
    dirpath: outputs/checkpoints/${logger.project}
    filename: 'best-checkpoint-{epoch:02d}-{val_loss:.2f}'
    save_top_k: 1 
    mode: min 
    save_last: true