defaults: 
  - base 
  - _self_ 

d_model: 64

datamodule:
  transforms_list: # r3m model expects unnormalized images with pixel values in [0, 255]
    - to_image
    - resize_cnn # resize_r3m
    - to_dtype_cnn # to_dtype_r3m

  robots: 
    - panda 
    - iiwa 
  tasks: 
    - square

  window_size: 1 # > 0
  batch_size: 64
  
model_vision: 
  _target_: models.fine_tune.fine_tuner.FineTunerVisual
  _recursive_: False

  optimizer_kwargs: 
    encoder: 
      lr: 1e-3
      weight_decay: 1e-3
    expander: 
      lr: 1e-3
      weight_decay: 1e-3

  scheduler_kwargs: 
    warmup_percentage: 0.1
    linear:  
      start_factor: 1e-4
      end_factor: 1.0 
      total_iters: null # adapted dynamically  
    cosine_annealing: 
      T_max: null # adapted dynamically 
      eta_min: 1e-5
  
  vision_encoder_kwargs: 
    # model_name: resnet18
    d_model: ${d_model}
    # start_layer: 1 # {3, 4}
  
    # r: 64
    # lora_alpha: 128
    # lora_dropout: 0.05
    # bias: lora_only

  expander_kwargs: 
    in_dim: ${d_model}
    h_dim: ${eval:"${d_model}*3/2"}
    out_dim: ${eval:"${d_model}*2"}

  vic_reg_kwargs: 
    log_every_n_steps: 50 

    lambda_: 0.05 # invariance
    mu: 1 # variance
    nu: 0.1 # covariance
    gamma: 1 # desired variance
    eps: 1e-4 # umerical stability

logger: 
  name: all_robots_all_tasks
  project: fine_tune

callbacks: 
  learning_rate_monitor: 
    _target_: lightning.pytorch.callbacks.LearningRateMonitor 
    logging_interval: step 

  model_checkpoint: 
    monitor: val/tot_loss