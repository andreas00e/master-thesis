defaults: 
  - base 
  - _self_ 

d_model: 256

datamodule:
  transforms_list: # r3m model expects unnormalized images with pixel values in [0, 255]
    - to_image
    - rotate 
    - color_jitter
    - resize_crop_cnn
    - to_dtype_cnn
    - normalize

  contrastive_transforms: true

  robots: 
    - panda 
    - iiwa 
  tasks: 
    - square
    - threading

  window_size: 1 # > 0
  batch_size: 512
  
model_vision: 
  _target_: models.fine_tune.fine_tuner.FineTunerVisual
  _recursive_: False

  optimizer_kwargs: 
    encoder: 
      lr: 1e-3
      weight_decay: 1e-3
    expander: 
      lr: 1e-3
      weight_decay: 1e-3

  scheduler_kwargs: 
    warmup_percentage: 5e-2
    linear:  
      start_factor: 1e-4
      end_factor: 1.0 
      total_iters: null # adapted dynamically  
    cosine_annealing: 
      T_max: null # adapted dynamically 
      eta_min: 1e-5
  
  vision_encoder_kwargs: 
    # model_name: resnet18
    d_model: ${d_model}
    # start_layer: 1 # {3, 4}
  
    # r: 64
    # lora_alpha: 128
    # lora_dropout: 0.05
    # bias: lora_only

  expander_kwargs: 
    in_dim: ${d_model}
    h_dim: ${eval:"${d_model}*2"}
    out_dim: ${eval:"${d_model}*4"}

  vic_reg_kwargs: 
    log_every_n_steps: 50 

    lambda_: 15 # invariance
    mu: 30.0 # variance
    nu: 1.0 # covariance
    gamma: 1.0 # desired variance
    eps: 1e-4 # umerical stability

logger: 
  name: exp_1024_l_25_m_30_n_1_new_aug_norm
  project: fine_tune

callbacks: 
  learning_rate_monitor: 
    _target_: lightning.pytorch.callbacks.LearningRateMonitor 
    logging_interval: step 

  model_checkpoint: 
    monitor: val/tot_loss